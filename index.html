<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Dones Espirituales</title>
    <style>
      :root {
        --radius: 8px;
        --green: #198754;
        --green-dark: #146c43;
        --gray-text: #495057;
        --red: #c62828;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; justify-content: center; align-items: center;
        min-height: 100dvh; background-color: #f4f4f9; margin: 0; color: #212529;
      }
      .card {
        background: white; padding: 2rem; border-radius: var(--radius);
        box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 90%; max-width: 450px;
      }
      h2 { text-align: center; margin-top: 0; color: var(--green); font-size: 1.4rem; }
      .field { margin-bottom: 1rem; }
      label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--gray-text); margin-bottom: 4px; }
      input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: var(--radius); font-size: 1rem; }
      input:focus { outline: none; border-color: var(--green); }
      .cedula-wrap { position: relative; }
      .cedula-wrap input { padding-right: 44px; }
      .toggle-visibility {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        background: transparent; border: none; color: var(--gray-text); font-size: 0.8rem; font-weight: 600; cursor: pointer;
      }
      button.submit {
        width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: var(--radius);
        background-color: var(--green); color: white; font-weight: bold; font-size: 1rem; cursor: pointer;
      }
      button.submit:hover { background-color: var(--green-dark); }
      button.submit:disabled { background-color: #a7d7c0; cursor: not-allowed; }
      #mensaje { text-align: center; font-size: 14px; margin-top: 12px; min-height: 1.2em; }
      #mensaje.error { color: var(--red); font-weight: 600; }
      #mensaje.exito { color: var(--green-dark); font-weight: 600; }
      .seccion-preguntas { max-height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 15px; border-radius: var(--radius); margin-bottom: 1rem; background: #fafafa; }
      .pregunta-item { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
      .pregunta-texto { font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; }
      .opciones-grid { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.85rem; }
    </style>
  </head>
  <body>

    <!-- LOGIN -->
    <div class="card" id="loginCard">
      <h2>Ingreso al Test</h2>
      <form id="loginForm">
        <div class="field">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" required>
        </div>
        <div class="field">
          <label for="cedula">Cédula</label>
          <div class="cedula-wrap">
            <input type="password" id="cedula" inputmode="numeric" required>
            <button type="button" class="toggle-visibility" id="toggleCedula">Mostrar</button>
          </div>
        </div>
        <button type="submit" class="submit" id="btnEntrar">Entrar</button>
        <p id="mensaje"></p>
      </form>
    </div>

    <!-- VISTA TEST -->
    <div class="card" id="vistaTest" style="display: none; max-width: 650px;">
      <h2 id="tituloBloque">Test</h2>
      <p id="infoUsuario" style="text-align: center; font-size: 0.85rem; color: var(--gray-text); margin-bottom: 1rem;"></p>
      <div id="mensajeErrorTest" style="color: var(--red); font-size: 0.85rem; text-align: center; margin-bottom: 10px; font-weight: 600;"></div>
      <div class="seccion-preguntas" id="contenedorPreguntas"></div>
      <div style="display: flex; gap: 10px;">
        <button type="button" class="submit" id="btnAnterior" onclick="cambiarPagina(-1)" style="display:none;">Anterior</button>
        <button type="button" class="submit" id="btnSiguiente" onclick="cambiarPagina(1)">Siguiente</button>
      </div>
    </div>

    <script>
      // ⚠️ PEGA AQUÍ TU URL DE LA APLICACIÓN WEB DE GOOGLE APPS SCRIPT ⚠️
      const URL_APIS = "https://script.google.com/macros/s/AKfycbwfuCMM08W4mDZsBfJx2muknIoMKcW4WVGjv5QEJ3yQNfB6-YScZdmcTP99Mmq6aSKG/exec";

      let usuarioActual = "";
      let bloqueActual = 1;
      let paginaActual = 0;
      let respuestasUsuario = new Array(180).fill(null);

      const preguntasBloque1 = [
        "1. Disfruto explicando la verdad bíblica a otros de manera clara.",
        "2. Siento una carga profunda por las almas perdidas y testifico de Cristo con facilidad.",
        "3. Me gusta proveer recursos económicos o materiales para la obra del Señor con alegría."
      ];
      for (let i = preguntasBloque1.length; i < 180; i++) {
        preguntasBloque1.push((i + 1) + ". Me identifico con este enunciado de servicio en el ministerio.");
      }

      const opciones = [
        { texto: "Muchísima", valor: 11 },
        { texto: "Mucha", valor: 9 },
        { texto: "Cierta", valor: 4 },
        { texto: "Poca", valor: 2 },
        { texto: "Ninguna", valor: 0 }
      ];

      document.getElementById('toggleCedula').addEventListener('click', () => {
        const c = document.getElementById('cedula');
        const oculto = c.type === 'password';
        c.type = oculto ? 'text' : 'password';
        event.target.textContent = oculto ? 'Ocultar' : 'Mostrar';
      });

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const usuario = document.getElementById('usuario').value.trim();
        const cedula = document.getElementById('cedula').value.trim();
        const mensaje = document.getElementById('mensaje');
        const btnEntrar = document.getElementById('btnEntrar');

        if (!usuario || !cedula) {
          mensaje.textContent = 'Llena ambos campos.';
          mensaje.className = 'error';
          return;
        }

        btnEntrar.disabled = true;
        mensaje.textContent = 'Verificando credenciales...';
        mensaje.className = '';

        try {
          let response = await fetch(URL_APIS, {
            method: "POST",
            body: JSON.stringify({ action: "login", usuario: usuario, cedula: cedula })
          });
          let resultado = await response.json();

          if (resultado.exito) {
            usuarioActual = usuario;
            bloqueActual = resultado.bloque || 1;
            mensaje.textContent = '¡Acceso concedido!';
            mensaje.className = 'exito';

            setTimeout(() => {
              document.getElementById('loginCard').style.display = 'none';
              document.getElementById('vistaTest').style.display = 'block';
              document.getElementById('infoUsuario').innerText = "Usuario: " + usuarioActual + " | Bloque " + bloqueActual;
              renderizarPagina();
            }, 800);
          } else {
            btnEntrar.disabled = false;
            mensaje.textContent = resultado.mensaje;
            mensaje.className = 'error';
          }
        } catch (err) {
          btnEntrar.disabled = false;
          mensaje.textContent = 'Error de conexión con el servidor.';
          mensaje.className = 'error';
        }
      });

      function renderizarPagina() {
        const contenedor = document.getElementById('contenedorPreguntas');
        contenedor.innerHTML = "";
        let inicio = paginaActual * 30;
        let fin = inicio + 30;

        document.getElementById('tituloBloque').innerText = "Autoevaluación - Parte " + (paginaActual + 1) + " de 6";

        for (let i = inicio; i < fin; i++) {
          let div = document.createElement('div');
          div.className = "pregunta-item";
          let htmlOpciones = "";
          opciones.forEach(op => {
            let checked = (respuestasUsuario[i] === op.valor) ? "checked" : "";
            htmlOpciones += `
              <label>
                <input type="radio" name="p_${i}" value="${op.valor}" ${checked} onclick="respuestasUsuario[${i}] = ${op.valor}; document.getElementById('mensajeErrorTest').textContent = '';">
                ${op.texto} (${op.valor})
              </label>
            `;
          });
          div.innerHTML = `<div class="pregunta-texto">${preguntasBloque1[i]}</div><div class="opciones-grid">${htmlOpciones}</div>`;
          contenedor.appendChild(div);
        }

        document.getElementById('btnAnterior').style.display = (paginaActual > 0) ? "block" : "none";
        document.getElementById('btnSiguiente').innerText = (paginaActual === 5) ? "Guardar y Enviar Bloque" : "Siguiente";
        contenedor.scrollTop = 0;
      }

      function cambiarPagina(dir) {
        let inicio = paginaActual * 30;
        let fin = inicio + 30;
        if (dir === 1) {
          for (let i = inicio; i < fin; i++) {
            if (respuestasUsuario[i] === null) {
              document.getElementById('mensajeErrorTest').textContent = "Responde todas las preguntas de esta página.";
              return;
            }
          }
        }
        paginaActual += dir;
        if (paginaActual > 5) {
          enviarBloqueCompleto();
        } else {
          renderizarPagina();
        }
      }

      async function enviarBloqueCompleto() {
        let btnSig = document.getElementById('btnSiguiente');
        btnSig.disabled = true;
        btnSig.innerText = "Guardando...";

        try {
          let response = await fetch(URL_APIS, {
            method: "POST",
            body: JSON.stringify({ action: "guardarBloque", usuario: usuarioActual, bloqueNum: bloqueActual, respuestas: respuestasUsuario })
          });
          let resultado = await response.json();
          alert(resultado.mensaje);
          location.reload();
        } catch (err) {
          btnSig.disabled = false;
          btnSig.innerText = "Guardar y Enviar Bloque";
          document.getElementById('mensajeErrorTest').textContent = "Error al guardar.";
        }
      }
    </script>
  </body>
</html>
