<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Dones Espirituales</title>
    <style>
      :root {
        --radius: 8px;
        --green: #198754;
        --green-dark: #146c43;
        --gray-text: #495057;
        --red: #c62828;
        --focus-ring: 0 0 0 3px rgba(25, 135, 84, 0.35);
      }

      * { box-sizing: border-box; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100dvh;
        background-color: #f4f4f9;
        margin: 0;
        color: #212529;
      }

      .card {
        background: white;
        padding: 2rem;
        border-radius: var(--radius);
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        width: 90%;
        max-width: 450px;
      }

      .card.test-card {
        max-width: 750px;
      }

      h2 {
        text-align: center;
        margin-top: 0;
        margin-bottom: 1.5rem;
        font-size: 1.4rem;
        color: var(--green);
      }

      .field {
        margin-bottom: 1rem;
      }

      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--gray-text);
        margin-bottom: 4px;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: var(--radius);
        font-size: 1rem;
      }

      input:focus {
        outline: none;
        border-color: var(--green);
        box-shadow: var(--focus-ring);
      }

      .cedula-wrap {
        position: relative;
      }

      .cedula-wrap input {
        padding-right: 44px;
      }

      .toggle-visibility {
        position: absolute;
        right: 6px;
        top: 50%;
        transform: translateY(-50%);
        width: auto;
        padding: 6px 8px;
        margin: 0;
        border: none;
        background: transparent;
        color: var(--gray-text);
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        border-radius: 4px;
      }

      .toggle-visibility:hover {
        background: #f1f1f1;
      }

      button.submit {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: none;
        border-radius: var(--radius);
        background-color: var(--green);
        color: white;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      button.submit:hover:not(:disabled) {
        background-color: var(--green-dark);
      }

      button.submit:disabled {
        background-color: #a7d7c0;
        cursor: not-allowed;
      }

      button.secondary { background-color: #6c757d; }
      button.secondary:hover { background-color: #5a6268; }

      button.danger { background-color: var(--red); }
      button.danger:hover { background-color: #b71c1c; }

      #mensaje {
        min-height: 1.2em;
        text-align: center;
        font-size: 14px;
        margin: 12px 0 0;
      }

      #mensaje.info { color: var(--gray-text); }
      #mensaje.error { color: var(--red); font-weight: 600; }
      #mensaje.exito { color: var(--green-dark); font-weight: 600; }

      .seccion-preguntas {
        max-height: 450px;
        overflow-y: auto;
        border: 1px solid #ddd;
        padding: 15px;
        border-radius: var(--radius);
        margin-bottom: 1rem;
        background: #fafafa;
      }
      
      .pregunta-item {
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #eee;
      }

      .pregunta-texto {
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 12px;
        line-height: 1.4;
      }

      .opciones-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        font-size: 0.85rem;
      }

      .opciones-grid label {
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        background: white;
        padding: 6px 10px;
        border: 1px solid #ddd;
        border-radius: var(--radius);
        transition: background-color 0.2s, border-color 0.2s;
        margin-bottom: 0;
        font-weight: 500;
      }

      .opciones-grid label:hover {
        background: #f1f8f5;
        border-color: var(--green);
      }

      .opciones-grid input[type="radio"] {
        width: auto;
        margin: 0;
        accent-color: var(--green);
      }

      .encabezado-instrucciones {
        background: #e8f5e9;
        padding: 15px;
        border-radius: var(--radius);
        margin-bottom: 15px;
        border-left: 4px solid var(--green);
      }
      .encabezado-instrucciones h3 {
        margin: 0 0 5px 0;
        color: var(--green-dark);
        font-size: 1.1rem;
      }
      .encabezado-instrucciones p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--gray-text);
      }
    </style>
  </head>
  <body>
    
    <!-- TARJETA DE LOGIN -->
    <div class="card" id="loginCard">
      <h2>Ingreso al Test</h2>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" name="usuario" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="cedula">Cédula</label>
          <div class="cedula-wrap">
            <input type="password" id="cedula" name="cedula" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required>
            <button type="button" class="toggle-visibility" id="toggleCedula" aria-pressed="false">Mostrar</button>
          </div>
        </div>

        <button type="submit" class="submit" id="btnEntrar">Entrar</button>
        <p id="mensaje" class="info" role="status" aria-live="polite"></p>
      </form>
    </div>

    <!-- TARJETA DEL TEST -->
    <div class="card test-card" id="vistaTest" style="display: none;">
      <h2 id="tituloBloque">Autoevaluación</h2>
      <p id="infoUsuario" style="text-align: center; font-size: 0.85rem; color: var(--gray-text); margin-bottom: 1rem;"></p>
      
      <div class="encabezado-instrucciones" id="cajaEncabezado">
        <h3 id="tituloSeccion">Me produce Alegría...</h3>
        <p id="subtituloSeccion">* Si en algunos de los campos que siguen no ha tenido ninguna experiencia, marque con una cruz la columna de la derecha.</p>
      </div>

      <div id="mensajeErrorTest" style="color: var(--red); font-size: 0.85rem; text-align: center; margin-bottom: 10px; font-weight: 600;"></div>

      <div class="seccion-preguntas" id="contenedorPreguntas"></div>

      <div style="display: flex; gap: 10px;" id="botonesNavegacion">
        <button type="button" class="submit" id="btnAnterior" onclick="cambiarPagina(-1)" style="display:none;">Anterior</button>
        <button type="button" class="submit" id="btnSiguiente" onclick="cambiarPagina(1)">Siguiente</button>
      </div>

      <!-- OPCIONES FINALES -->
      <div id="panelFinal" style="display: none; text-align: center; margin-top: 15px;">
        <p style="font-weight: bold; color: var(--green-dark); margin-bottom: 15px;">¡Test guardado correctamente!</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
          <button type="button" class="submit secondary" onclick="editarRespuestas()">Editar</button>
          <button type="button" class="submit danger" onclick="borrarRespuestas()">Borrar</button>
          <button type="button" class="submit" onclick="finalizarListo()">Listo</button>
        </div>
      </div>
    </div>

        toggleCedula.textContent = oculto ? 'Ocultar' : 'Mostrar';
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const usuario = document.getElementById('usuario').value.trim();
        const cedula = cedulaInput.value.trim();

        if (!usuario || !cedula) {
          mensaje.textContent = 'Llena ambos campos.';
          mensaje.className = 'error';
          return;
        }

        btnEntrar.disabled = true;
        mensaje.textContent = 'Detectando IP real y verificando restricciones...';
        mensaje.className = 'info';

        // 1. Detectar IP real pública en el cliente
        fetch('https://api.ipify.org?format=json')
          .then(response => response.json())
          .then(dataIP => {
            const ipRealCliente = dataIP.ip;

            // 2. Enviar credenciales e IP real a Apps Script
            return fetch(WEB_APP_URL, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({
                action: "validarLogin",
                usuario: usuario,
                cedula: cedula,
                ipCliente: ipRealCliente
              })
            });
          })
          .then(res => res.json())
          .then(res => {
            if (res.exito) {
              usuarioActual = usuario;
              tipoTest = res.tipo; 
              
              if (tipoTest === 'principal') {
                respuestasUsuario = new Array(180).fill(null);
              } else {
                respuestasUsuario = new Array(30).fill(null);

              mensaje.textContent = '¡Acceso concedido!';

              setTimeout(() => {
                document.getElementById('loginCard').style.display = 'none';
                document.getElementById('vistaTest').style.display = 'block';

        } else if (tipoTest === 'mayusculas') {
          indexBloque = 6;
          preguntasActuales = preguntasMayusculas;
          document.getElementById('tituloBloque').innerText = "Evaluación de Opinión - Mayúsculas (A-DD)";
        } else {
          indexBloque = 7;
          preguntasActuales = preguntasMinusculas;
          document.getElementById('tituloBloque').innerText = "Evaluación de Opinión - Minúsculas (a-dd)";
        }

        document.getElementById('tituloSeccion').innerText = textosEncabezado[indexBloque].titulo;
        document.getElementById('subtituloSeccion').innerText = textosEncabezado[indexBloque].sub;

        let opcionesActuales = opcionesPorBloque[indexBloque];

        preguntasActuales.forEach((preguntaTexto, idx) => {
          let globalIdx = (tipoTest === 'principal') ? (paginaActual * 30 + idx) : idx;
          let div = document.createElement('div');
          div.className = "pregunta-item";

          let htmlOpciones = "";
          opcionesActuales.forEach(op => {
            let checked = (respuestasUsuario[globalIdx] === op.valor) ? "checked" : "";
            htmlOpciones += `
              <label>
                <input type="radio" name="p_${globalIdx}" value="${op.valor}" ${checked} onclick="guardarRespuesta(${globalIdx}, ${op.valor})">
                ${op.texto} (${op.valor})
              </label>
            `;
          });

          div.innerHTML = `
            <div class="pregunta-texto">${preguntaTexto}</div>
            <div class="opciones-grid">${htmlOpciones}</div>
          `;
          contenedor.appendChild(div);
        });

        if (tipoTest === 'principal') {
          document.getElementById('btnAnterior').style.display = (paginaActual > 0) ? "block" : "none";
          document.getElementById('btnSiguiente').innerText = (paginaActual === 5) ? "Guardar" : "Siguiente";
        } else {
          document.getElementById('btnAnterior').style.display = "none";
          document.getElementById('btnSiguiente').innerText = "Guardar";
        }
        contenedor.scrollTop = 0;
      }

      function guardarRespuesta(indice, valor) {
        respuestasUsuario[indice] = valor;
        document.getElementById('mensajeErrorTest').innerText = "";
      }

      function cambiarPagina(direccion) {
        let maxPreguntas = (tipoTest === 'principal') ? 30 : respuestasUsuario.length;
        let inicio = (tipoTest === 'principal') ? (paginaActual * 30) : 0;
        let fin = inicio + maxPreguntas;

        if (direccion === 1) {
          for (let i = inicio; i < fin; i++) {
            if (respuestasUsuario[i] === null) {
              document.getElementById('mensajeErrorTest').innerText = "Responde todas las preguntas antes de continuar.";
              return;
            }
          }
        }

        if (tipoTest === 'principal') {
          paginaActual += direccion;
          if (paginaActual > 5) {
            enviarBloqueCompleto();
          } else {
            renderizarPagina();
          }
        } else {
          enviarBloqueCompleto();
        }
      }

        btnSig.innerText = "Guardando...";

            tipoTest: tipoTest,
            respuestas: respuestasUsuario

            document.querySelector('.seccion-preguntas').style.display = 'none';

            document.querySelector('.encabezado-instrucciones').style.display = 'none';

          document.getElementById('mensajeErrorTest').innerText = "Error de red al guardar.";

      }
